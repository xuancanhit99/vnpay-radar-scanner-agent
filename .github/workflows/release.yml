name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath pyproject.toml `
            -Pattern '^version = "([^\"]+)"$').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install uv==0.10.4
          choco install nsis --no-progress -y

      - name: Audit runtime dependencies
        shell: pwsh
        run: |
          $requirements = Join-Path $env:RUNNER_TEMP "runtime-requirements.txt"
          uv export --frozen --no-dev --no-emit-project `
            --format requirements-txt --output-file $requirements
          uvx --from pip-audit==2.10.1 pip-audit -r $requirements

      - name: Build release
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Verify release
        shell: pwsh
        run: .\packaging\verify-release.ps1 -Version $env:RELEASE_VERSION

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "packaging/output/VNPAYRadarScannerAgent-Setup-$env:RELEASE_VERSION-x64.exe",
            "packaging/output/VNPAYRadarScannerAgent-Portable-$env:RELEASE_VERSION-x64.zip",
            "packaging/output/VNPAYRadarScannerAgent-$env:RELEASE_VERSION-SHA256SUMS.txt"
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "VNPAY RADAR Scanner Agent $env:GITHUB_REF_NAME" `
            --generate-notes
