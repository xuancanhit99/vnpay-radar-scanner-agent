[project]
name = "radar-scanner-agent"
version = "0.5.1"
description = "Windows edge agent for VNPAY RADAR APK Scanner"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
]

[project.scripts]
radar-scanner-agent = "radar_agent.main:main"
radar-scanner-manager = "radar_agent.manager:main"

[dependency-groups]
dev = [
    "pyinstaller==6.16.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
